name: Distorama Update

# Regenerate Toulouse Distorama GeoJSONs from distorama.neocities.org,
# commit any changes to main, then dispatch deploy.yml.

on:
  schedule:
    - cron: '0 5,17 * * *'   # 05:00 and 17:00 UTC every day
  workflow_dispatch:

permissions:
  contents: write   # commit + push generated files
  actions: write    # dispatch deploy.yml

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Regenerate Distorama GeoJSONs
        run: uv run scripts/toulouse-distorama/generate.py

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage all paths written by generate.py
          git add static/toulouse-distorama/
          git add scripts/toulouse-distorama/.geocache.json
          git add scripts/toulouse-distorama/unmatched-venues.txt
          find content -maxdepth 1 -name 'toulouse-distorama*' -type d \
            -exec git add {} +

          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No changes — skipping commit and deploy."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "chore(toulouse-distorama): regenerate GeoJSONs — ${TIMESTAMP}"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Dispatch deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            console.log('deploy.yml dispatched.');
