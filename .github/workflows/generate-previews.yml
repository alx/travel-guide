name: Generate Map Previews

# Generates OG preview screenshots for maps that were pushed directly to main
# (bypassing the PR map-preview workflow) or that are missing previews entirely.
#
# The PR workflow (map-preview.yml) handles previews during code review.
# This workflow handles:
#   • Direct pushes to main that change GeoJSON / TopoJSON
#   • Manual backfill (workflow_dispatch, empty slugs = all missing)
#   • On-demand regeneration (workflow_dispatch, explicit slug list)
#
# Exclusion: videosurveillance-france is never generated by this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'static/**/*.geojson'
      - 'static/**/*.topojson'
  workflow_dispatch:
    inputs:
      slugs:
        description: >
          Space-separated map slugs to (re)generate.
          Leave empty to generate ALL maps that are missing a preview.
        required: false
        default: ''

permissions:
  contents: write
  actions: write

# Only one preview job at a time — avoids concurrent git pushes
concurrency:
  group: generate-previews
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 for push diff

      # ── 1. Determine which slugs to screenshot ───────────────────────────
      - name: Determine slugs
        id: slugs
        run: |
          set -euo pipefail
          BLOCKLIST="videosurveillance-france toulouse-distorama/events"

          # Helper: filter out blocked slugs and empty lines
          filter() {
            grep -vxF "$BLOCKLIST" | grep -v '^$' || true
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.slugs }}" ]; then
            # ── Manual with explicit slugs ──────────────────────────────────
            SLUGS=$(echo "${{ inputs.slugs }}" | tr ' ' '\n' | filter | tr '\n' ' ' | xargs)

          elif [ "${{ github.event_name }}" = "push" ]; then
            # ── Push to main: changed GeoJSON/TopoJSON files ────────────────
            SLUGS=$(git diff --name-only HEAD~1 HEAD \
              | grep -E '^static/.+\.(geojson|topojson)$' \
              | sed 's|^static/||' \
              | awk -F'/' '{
                  if ($1 == "airbnb" && NF >= 3) print $1"/"$2
                  else print $1
                }' \
              | sort -u \
              | filter \
              | tr '\n' ' ' | xargs)

          else
            # ── workflow_dispatch, no slugs: backfill all missing ───────────
            MISSING=""

            # Top-level static dirs (skip non-map dirs and dated distorama event pages)
            for d in static/*/; do
              slug=$(basename "$d")
              # Skip infrastructure dirs and per-event pages
              case "$slug" in
                images|toulouse-distorama-*|airbnb) continue ;;
              esac
              # Skip blocklist
              echo "$slug" | filter > /dev/null || continue
              [ ! -f ".github/previews/${slug}.png" ] && MISSING="$MISSING $slug"
            done

            # Airbnb sub-maps: static/airbnb/<id>/
            for d in static/airbnb/*/; do
              [ -d "$d" ] || continue
              id=$(basename "$d")
              slug="airbnb/$id"
              [ ! -f ".github/previews/airbnb-${id}.png" ] && MISSING="$MISSING $slug"
            done

            SLUGS=$(echo "$MISSING" | tr ' ' '\n' | filter | tr '\n' ' ' | xargs)
          fi

          if [ -z "$SLUGS" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No slugs to generate."
          else
            echo "found=true"  >> "$GITHUB_OUTPUT"
            echo "slugs=$SLUGS" >> "$GITHUB_OUTPUT"
            echo "Slugs: $SLUGS"
          fi

      # ── 2. Hugo build ────────────────────────────────────────────────────
      - name: Setup Hugo
        if: steps.slugs.outputs.found == 'true'
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.0'
          extended: true

      - name: Build site
        if: steps.slugs.outputs.found == 'true'
        run: hugo --minify

      # ── 3. Node + Playwright ─────────────────────────────────────────────
      - name: Setup Node
        if: steps.slugs.outputs.found == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.slugs.outputs.found == 'true'
        run: npm install

      - name: Install Playwright Chromium
        if: steps.slugs.outputs.found == 'true'
        run: npx playwright install chromium --with-deps

      # ── 4. Serve + screenshot ────────────────────────────────────────────
      - name: Serve built site
        if: steps.slugs.outputs.found == 'true'
        run: |
          npx --yes serve public --listen 1414 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:1414/ > /dev/null && break
            echo "Waiting for server… ($i)"
            sleep 1
          done

      - name: Generate screenshots
        if: steps.slugs.outputs.found == 'true'
        run: node scripts/ci/generate-map-previews.js ${{ steps.slugs.outputs.slugs }}
        env:
          PREVIEW_BASE_URL: http://localhost:1414

      # ── 5. Commit previews to main ───────────────────────────────────────
      - name: Commit previews
        id: commit
        if: steps.slugs.outputs.found == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/previews/
          if git diff --staged --quiet; then
            echo "committed=false" >> "$GITHUB_OUTPUT"
            echo "No preview changes to commit."
          else
            git commit -m "ci: generate map previews for ${{ steps.slugs.outputs.slugs }} [preview]"
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      # ── 6. Trigger deploy so previews are served as og:image ────────────
      - name: Dispatch deploy
        if: steps.commit.outputs.committed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              ref: 'main'
            });
            console.log('deploy.yml dispatched.');
