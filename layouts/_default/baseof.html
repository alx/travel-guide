<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>

  <!-- Primary Meta -->
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}images/og-travels.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}images/og-travels.png">

  <!-- Structured Data -->
  {{ if .IsHome }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL }}",
    "description": "{{ .Site.Params.description }}",
    "author": { "@type": "Person", "name": "{{ .Site.Params.author }}" }
  }
  </script>
  {{ end }}

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a1a; }
    .site-header { background: #1a3a5c; color: white; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .site-header h1 { font-size: 1.25rem; font-weight: 600; }
    .site-header a { color: white; text-decoration: none; }
    .site-nav { display: flex; gap: 1.5rem; margin-left: auto; font-size: 0.9rem; }
    .site-nav a:hover { text-decoration: underline; }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    footer { text-align: center; padding: 2rem; color: #666; font-size: 0.85rem; margin-top: 2rem; }
  </style>
  {{ block "head" . }}{{ end }}
</head>
<body>
  <header class="site-header">
    <a href="{{ "/" | relURL }}">🗺️ Girard-Davila Travels</a>
    <nav class="site-nav">
      <a href="{{ "/koh-samui/" | relURL }}">Koh Samui</a>
      <a href="{{ "/hoi-an/" | relURL }}">Hoi An</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>Built with Hugo · Open data · <a href="https://github.com/alx/travel-guide" target="_blank">GitHub</a></footer>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
