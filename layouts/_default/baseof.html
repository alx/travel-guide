<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}</title>

  <!-- Primary Meta -->
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="author" content="{{ .Site.Params.author }}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ .Permalink }}">

  <!-- Open Graph -->
  <meta property="og:type" content="{{ if .IsHome }}website{{ else }}article{{ end }}">
  <meta property="og:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
  <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta property="og:url" content="{{ .Permalink }}">
  <meta property="og:site_name" content="{{ .Site.Title }}">
  <meta property="og:image" content="{{ .Site.BaseURL }}images/og-travels.png">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} — {{ .Site.Title }}{{ end }}">
  <meta name="twitter:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <meta name="twitter:image" content="{{ .Site.BaseURL }}images/og-travels.png">

  <!-- Structured Data -->
  {{ if .IsHome }}
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "{{ .Site.Title }}",
    "url": "{{ .Site.BaseURL }}",
    "description": "{{ .Site.Params.description }}",
    "author": { "@type": "Person", "name": "{{ .Site.Params.author }}" }
  }
  </script>
  {{ end }}

  <!-- Embed mode detection — must run before first paint to avoid flash -->
  <script>
    (function () {
      try {
        var isEmbed = new URLSearchParams(window.location.search).get('embed') === '1'
          || window.self !== window.top;
        if (isEmbed) document.documentElement.classList.add('embed-mode');
      } catch (e) {}
    })();
  </script>

  <!-- topojson-client for TopoJSON map support -->
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js" defer></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a1a; }
    .site-header { background: #1a3a5c; color: white; padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; }
    .site-header h1 { font-size: 1.25rem; font-weight: 600; }
    .site-header a { color: white; text-decoration: none; }
    .site-nav { display: flex; gap: 1.5rem; margin-left: auto; font-size: 0.9rem; }
    .site-nav a:hover { text-decoration: underline; }
    main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
    footer { text-align: center; padding: 2rem; color: #666; font-size: 0.85rem; margin-top: 2rem; }

    /* ── Embed mode: map-only view ── */
    html.embed-mode .site-header   { display: none !important; }
    html.embed-mode footer         { display: none !important; }
    html.embed-mode main           { max-width: 100%; padding: 0 !important; margin: 0 !important; }
    html.embed-mode .page-header   { display: none !important; }
    html.embed-mode #map-toolbar   { display: none !important; }
    html.embed-mode .contact-form-float { display: none !important; }
    html.embed-mode #paywall-modal { display: none !important; }
    html.embed-mode .map-layout    { height: 100vh !important; min-height: 100vh !important; gap: 0 !important; }
    html.embed-mode #map           { height: 100% !important; border-radius: 0 !important; box-shadow: none !important; }
    /* Hide sidebar in embed — map-only */
    html.embed-mode .sidebar       { display: none !important; }
    html.embed-mode body           { background: white; }
  </style>
  {{ block "head" . }}{{ end }}

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-WDJF6L9P30"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-WDJF6L9P30');
  </script>
</head>
<body>
  {{ partial "vip-manager.html" . }}
  <script>
    // GitHub OAuth config (from hugo.toml)
    window.GITHUB_CLIENT_ID = {{ .Site.Params.githubClientId | default "" | jsonify }};
    window.GITHUB_WORKER_URL = {{ .Site.Params.githubWorkerUrl | default "" | jsonify }};
  </script>
  <header class="site-header">
    <a href="{{ "/" | relURL }}">🗺️ Girard-Davila Travels</a>
    <nav class="site-nav">
      <a href="{{ "/koh-samui/" | relURL }}">Koh Samui</a>
      <a href="{{ "/hoi-an/" | relURL }}">Hoi An</a>
      <a href="{{ "/fishing-boat/" | relURL }}">⚓ Expedition</a>
    </nav>
  </header>
  <main>{{ block "main" . }}{{ end }}</main>
  <footer>Built with Hugo · Open data · <a href="https://github.com/alx/travel-guide" target="_blank">GitHub</a></footer>
  {{ block "scripts" . }}{{ end }}
</body>
</html>
