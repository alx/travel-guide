{{ define "head" }}
{{ partial "map-poi-styles.html" . }}
<style>
/* ── Distorama monochrome theme ── */
body { background: #0a0a0a; }
.overlay-card {
  background: rgba(12,12,12,0.97) !important;
  border: 1px solid rgba(255,255,255,0.1) !important;
  box-shadow: 0 4px 24px rgba(0,0,0,0.7) !important;
}
.overlay-card .page-header h1 { color: #fff; }
.overlay-card .page-header p { color: #888; }
.site-brand { color: #555 !important; }
.header-btn { background: #1a1a1a !important; border-color: #333 !important; color: #bbb !important; }
.header-btn:hover, .header-btn.active { border-color: #fff !important; color: #fff !important; background: #2a2a2a !important; }
.search-box { background: #111 !important; border-color: #2a2a2a !important; color: #eee !important; }
.search-box::placeholder { color: #444; }
.search-box:focus { border-color: #555 !important; }
#filter-btns { gap: 0.4rem; }
.filter-btn { background: #111 !important; border-color: #2a2a2a !important; color: #888 !important; font-size: 0.75rem; }
.filter-btn.active { background: #fff !important; color: #000 !important; border-color: #fff !important; }
.poi-card { background: #111 !important; border-color: transparent !important; }
.poi-card:hover, .poi-card.active { border-color: rgba(255,255,255,0.4) !important; }
.poi-card h3 { color: #eee; }
.poi-card .poi-addr { color: #666; }
.poi-card .poi-actions a { color: #888 !important; }
.poi-card .poi-actions a:hover { color: #fff !important; }
.cat-badge { background: #1e1e1e; color: #aaa; }
.show-more-pill { background: rgba(15,15,15,0.95) !important; color: #555 !important; border-color: rgba(255,255,255,0.08) !important; }
.copy-toast { background: rgba(255,255,255,0.12) !important; }
/* venue nav row */
.venue-nav { display: flex; gap: 0.4rem; margin-top: 0.4rem; align-items: stretch; }
.venue-nav > .header-btn { border-radius: 0 !important; padding: 0.55rem 0.7rem !important; font-size: 0.8rem !important; }
.venue-nav-btn { flex: 0 0 auto; min-width: 2.6rem; font-size: 1rem !important; }
.show-all-btn { flex: 1; }
</style>
{{ end }}

{{ define "main" }}
<div id="map"></div>
<div class="map-overlay">
  <div class="overlay-card">
    <a href="{{ "/" | relURL }}" class="site-brand">🗺️ Maps</a>
    <div class="page-header">
      <h1>Distorama</h1>
      <p>Les lieux underground de Toulouse. Source : <a href="https://distorama.neocities.org/" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline;">distorama.neocities.org</a></p>
    </div>
    <div class="header-actions">
      <button class="header-btn" id="list-toggle" onclick="this.classList.toggle('active');document.querySelector('.overlay-card.scrollable').classList.toggle('mobile-open');">📍 Lieux</button>
      <button class="header-btn" id="locate-btn" onclick="toggleLocation()" title="Ma position">📍 Position</button>
    </div>
    <input class="search-box" type="text" id="search" placeholder="🔍 Rechercher un lieu…" oninput="filterPOIs()">
    <div id="filter-btns"></div>
    <div class="venue-nav">
      <button class="header-btn venue-nav-btn" onclick="navigateVenue(-1)" title="Lieu précédent"><i class="fas fa-chevron-left"></i></button>
      <button class="header-btn show-all-btn" id="show-all-btn" onclick="showAll()">Tous les lieux</button>
      <button class="header-btn venue-nav-btn" onclick="navigateVenue(1)" title="Lieu suivant"><i class="fas fa-chevron-right"></i></button>
    </div>
  </div>
  <div class="overlay-card scrollable">
    <div id="poi-list"></div>
  </div>
</div>
<div class="copy-toast" id="copy-toast"></div>
{{ end }}

{{ define "scripts" }}
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
window.MAP_CONFIG = {
  title: 'Distorama — Toulouse underground',
  geojsonUrl: '{{ "/toulouse-distorama/locations.geojson" | relURL }}',
  center: [43.6047, 1.4442],
  zoom: 13,
  focusZoom: 16,
  tiles: {
    url: 'https://tiles.stadiamaps.com/tiles/stamen_toner/{z}/{x}/{y}{r}.png?api_key={{ os.Getenv "HUGO_STADIA_API_KEY" }}',
    attribution: '© <a href="https://stamen.com">Stamen Design</a>, © <a href="https://stadiamaps.com/">Stadia Maps</a>, © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom: 20
  }
};
window.CATEGORY_COLORS = {
  'Concert Bar': '#ffffff',
  'Record Shop': '#ffffff',
  'Cinema': '#ffffff',
  'Radio': '#ffffff',
  'Studio': '#ffffff',
  'Boutique': '#ffffff',
  'Merch/Print': '#ffffff'
};
window.CATEGORY_ICONS = {
  'Concert Bar': 'fa-music',
  'Record Shop': 'fa-record-vinyl',
  'Cinema': 'fa-film',
  'Radio': 'fa-tower-broadcast',
  'Studio': 'fa-microphone',
  'Boutique': 'fa-store',
  'Merch/Print': 'fa-print',
  'Theater': 'fa-masks-theater',
  'Other': 'fa-location-dot'
};
</script>
{{ partial "map-poi-helpers.html" . }}
{{ partial "map-geolocation.html" . }}
<script>
/* ── Distorama venues: venue selection UX ── */

let selectedVenueId = null, navIndex = -1;

makeIcon = function(category, status) {
  const secondary = status === 'secondary';
  const size = secondary ? 22 : 34;
  const cls = CATEGORY_ICONS[category] || 'fa-location-dot';
  const fs = secondary ? 10 : 15;
  const opacity = secondary ? '0.55' : '1';
  return L.divIcon({
    className: '',
    html: `<div style="background:#111;width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.8);border:2px solid rgba(255,255,255,0.6);opacity:${opacity};"><i class="fa-solid ${cls}" style="color:#fff;font-size:${fs}px;"></i></div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2]
  });
};

/* FA icon labels in filter chips */
setupFilters = function(pois) {
  const cats = ['All', ...new Set(pois.map(f => f.properties.category || 'Other'))];
  const container = document.getElementById('filter-btns');
  if (!container) return;
  container.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
    btn.dataset.cat = cat;
    const cls = CATEGORY_ICONS[cat];
    btn.innerHTML = cls ? `<i class="fa-solid ${cls}" style="margin-right:0.3em;"></i>${cat}` : cat;
    btn.onclick = () => {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterPOIs();
    };
    container.appendChild(btn);
  });
};

/* Returns the full navigable list (ignores selectedVenueId, respects search + category) */
function getNavList() {
  const q = document.getElementById('search').value.toLowerCase();
  return allPOIs.filter(f => {
    const p = f.properties;
    const matchCat = activeFilter === 'All' || p.category === activeFilter;
    const matchSearch = !q || p.name.toLowerCase().includes(q) || (p.address || '').toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

/* Returns list for rendering (applies selectedVenueId filter when set) */
function getFilteredPOIs() {
  const q = document.getElementById('search').value.toLowerCase();
  return allPOIs.filter(f => {
    if (selectedVenueId !== null && f._id !== selectedVenueId) return false;
    const p = f.properties;
    const matchCat = activeFilter === 'All' || p.category === activeFilter;
    const matchSearch = !q || p.name.toLowerCase().includes(q) || (p.address || '').toLowerCase().includes(q);
    return matchCat && matchSearch;
  });
}

updateMarkers = function() {
  const q = document.getElementById('search').value.toLowerCase();
  if (markerCluster) {
    markerCluster.clearLayers();
  } else {
    Object.values(markers).forEach(m => map.removeLayer(m));
  }
  Object.keys(markers).forEach(k => delete markers[k]);
  allPOIs.forEach(f => {
    const p = f.properties;
    const matchCat = activeFilter === 'All' || p.category === activeFilter;
    const matchSearch = !q || p.name.toLowerCase().includes(q) || (p.address || '').toLowerCase().includes(q);
    if (!matchCat || !matchSearch) return;
    const [lng, lat] = f.geometry.coordinates;
    const marker = L.marker([lat, lng], { icon: makeIcon(p.category, p.status) });
    marker.on('click', () => { if (activeCard !== f._id) focusPOI(f); });
    if (markerCluster) { markerCluster.addLayer(marker); } else { marker.addTo(map); }
    markers[f._id] = marker;
  });
};

renderSidebar = function() {
  const list = document.getElementById('poi-list');
  list.innerHTML = '';
  const filtered = getFilteredPOIs();
  filtered.forEach(f => {
    const p = f.properties;
    const card = document.createElement('div');
    card.className = 'poi-card';
    card.id = 'card-' + f._id;
    const cls = CATEGORY_ICONS[p.category] || 'fa-location-dot';
    card.innerHTML = `
      <span class="cat-badge"><i class="fa-solid ${cls}" style="color:#fff;margin-right:0.3em;"></i>${p.category}</span>
      <h3>${p.name}</h3>
      ${p.address ? `<div class="poi-addr">📍 ${p.address}</div>` : ''}
      <div class="poi-actions">
        ${p.url ? `<a href="${p.url}" target="_blank" rel="noopener">🌐 Site</a>` : ''}
        <a href="#" onclick="event.preventDefault();navigator.clipboard?.writeText('${p.address || p.name}');showToast('Adresse copiée')">📋 Copier</a>
      </div>`;
    card.onclick = () => focusPOI(f);
    list.appendChild(card);
  });
  if (filtered.length === 0) {
    list.innerHTML = '<p style="color:#555;font-size:0.85rem;padding:0.5rem;">Aucun lieu trouvé.</p>';
  }
};

focusPOI = function(f) {
  const [lng, lat] = f.geometry.coordinates;
  _flyingTo = true;
  map.flyTo([lat, lng], MAP_CONFIG.focusZoom || 15, { duration: 0.8 });
  map.once('moveend', () => { _flyingTo = false; });
  if (activeCard !== null) document.getElementById('card-' + activeCard)?.classList.remove('active');
  activeCard = f._id;
  selectedVenueId = f._id;
  navIndex = getNavList().findIndex(x => x._id === f._id);
  renderSidebar();
  document.getElementById('card-' + f._id)?.classList.add('active');
  document.getElementById('card-' + f._id)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const u = new URL(window.location.href);
  u.searchParams.set('poi', slugify(f.properties.name));
  history.replaceState({}, '', u);
  fadePOIs(f._id);
};

clearFocus = function() {
  if (selectedVenueId === null && activeCard === null) return;
  selectedVenueId = null;
  navIndex = -1;
  activeCard = null;
  Object.entries(markers).forEach(([id, m]) => {
    const el = m.getElement();
    if (el) el.style.opacity = secondaryIds.has(String(id)) ? '0.55' : '1';
  });
  const u = new URL(window.location.href);
  u.searchParams.delete('poi');
  history.replaceState({}, '', u);
  renderSidebar();
};

function showAll() {
  clearFocus();
  _flyingTo = true;
  map.flyTo(MAP_CONFIG.center, MAP_CONFIG.zoom, { duration: 0.8 });
  map.once('moveend', () => { _flyingTo = false; });
}

function navigateVenue(dir) {
  const list = getNavList();
  if (!list.length) return;
  navIndex = navIndex === -1
    ? (dir > 0 ? 0 : list.length - 1)
    : (navIndex + dir + list.length) % list.length;
  focusPOI(list[navIndex]);
}
</script>
{{ end }}
