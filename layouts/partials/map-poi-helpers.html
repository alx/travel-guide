<script>
const CATEGORY_COLORS = window.CATEGORY_COLORS;
const CATEGORY_ICONS  = window.CATEGORY_ICONS;
const MAP_CONFIG      = window.MAP_CONFIG;

let allPOIs = [], customLayer = null, markers = {}, activeFilter = 'All', activeCard = null;
let secondaryIds = new Set();
Object.defineProperty(window, 'allPOIs', { get: () => allPOIs, configurable: true });
window._mapCategoryColors = CATEGORY_COLORS;
window._mapCategoryIcons  = CATEGORY_ICONS;

const map = L.map('map', { maxZoom: 19 }).setView(MAP_CONFIG.center, MAP_CONFIG.zoom);
window._leafletMap = map;
let markerCluster = null;
if (MAP_CONFIG.useClustering && typeof L.markerClusterGroup === 'function') {
  markerCluster = L.markerClusterGroup(Object.assign({ chunkedLoading: true }, MAP_CONFIG.clusterOptions || {}));
  map.addLayer(markerCluster);
}
let _flyingTo = false;
map.on('click', () => clearFocus());
map.on('popupclose', () => clearFocus());
map.on('dragstart', () => { if (!_flyingTo) clearFocus(); });
map.on('zoomstart', () => { if (!_flyingTo) clearFocus(); });
const _tiles = MAP_CONFIG.tiles || {};
L.tileLayer(_tiles.url || 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: _tiles.attribution || '© OpenStreetMap contributors',
  maxZoom: _tiles.maxZoom || 19,
  subdomains: _tiles.subdomains || 'abc'
}).addTo(map);

function slugify(name) {
  return name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}
function showToast(msg) {
  const t = document.getElementById('copy-toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function fadePOIs(activeId) {
  Object.entries(markers).forEach(([id, m]) => {
    const el = m.getElement();
    if (el) el.style.opacity = (String(id) === String(activeId)) ? '1'
      : secondaryIds.has(String(id)) ? '0.3' : '0.5';
  });
  document.querySelectorAll('.poi-card').forEach(c =>
    c.classList.toggle('faded', c.id !== 'card-' + activeId));
}
function clearFocus() {
  if (activeCard === null) return;
  document.getElementById('card-' + activeCard)?.classList.remove('active');
  activeCard = null;
  Object.entries(markers).forEach(([id, m]) => {
    const el = m.getElement();
    if (el) el.style.opacity = secondaryIds.has(String(id)) ? '0.55' : '1';
  });
  document.querySelectorAll('.poi-card').forEach(c => c.classList.remove('faded'));
  const u = new URL(window.location.href);
  u.searchParams.delete('poi');
  history.replaceState({}, '', u);
  window.clearRoute?.();
}

function makeIcon(category, status) {
  const color = CATEGORY_COLORS[category] || '#6b7280';
  const cls = CATEGORY_ICONS[category] || 'fa-location-dot';
  const secondary = status === 'secondary';
  const size = secondary ? 22 : 32;
  const fs   = secondary ? 10 : 14;
  const border = secondary ? '#bbb' : 'white';
  const opacity = secondary ? '0.55' : '1';
  return L.divIcon({
    className: '',
    html: `<div style="background:${color};width:${size}px;height:${size}px;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,0.3);border:2px solid ${border};opacity:${opacity};"><i class="fa-solid ${cls}" style="color:white;font-size:${fs}px;"></i></div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2],
    popupAnchor: [0, -(size / 2) - 4]
  });
}

function renderSidebar() {
  const search = document.getElementById('search').value.toLowerCase();
  const list = document.getElementById('poi-list');
  list.innerHTML = '';
  const filtered = allPOIs.filter(f => {
    const p = f.properties;
    const matchCat = activeFilter === 'All' || p.category === activeFilter;
    const matchSearch = !search || p.name.toLowerCase().includes(search) || (p.address||'').toLowerCase().includes(search);
    return matchCat && matchSearch;
  });
  const limit = MAP_CONFIG.maxSidebarItems;
  const visible = limit ? filtered.slice(0, limit) : filtered;
  visible.forEach(f => {
    const p = f.properties;
    const cat = p.category || 'Other';
    const color = CATEGORY_COLORS[cat] || '#6b7280';
    const cls = CATEGORY_ICONS[cat] || 'fa-location-dot';
    const card = document.createElement('div');
    card.className = 'poi-card';
    card.id = 'card-' + f._id;
    const [lng, lat] = f.geometry.coordinates;
    const slug = slugify(p.name);
    card.innerHTML = `
    <span class="cat-badge" style="background:${color}22;color:${color};"><i class="fa-solid ${cls}" style="margin-right:0.3em;"></i>${cat}</span>
    <h3>${p.name}</h3>
    ${p.address ? `<div class="poi-addr"><i class="fa-solid fa-location-dot" style="margin-right:0.35em;opacity:0.6;"></i>${p.address}</div>` : ''}
    ${p.notes ? `<div class="poi-addr" style="margin-top:0.25rem;font-style:italic;">${p.notes}</div>` : ''}
    ${p.hours ? `<div class="poi-addr" style="margin-top:0.25rem;"><i class="fa-regular fa-clock" style="margin-right:0.35em;opacity:0.6;"></i>${p.hours.split(/;\s*/).join('<br>')}</div>` : ''}
    ${p.price ? `<div class="poi-addr" style="margin-top:0.15rem;"><i class="fa-solid fa-tag" style="margin-right:0.35em;opacity:0.6;"></i>${p.price}</div>` : ''}
    ${!MAP_CONFIG.hidePhone && p.phone ? `<div class="poi-addr" style="margin-top:0.15rem;"><i class="fa-solid fa-phone" style="margin-right:0.35em;opacity:0.6;"></i>${p.phone}</div>` : ''}
    <div class="poi-actions">
        ${!MAP_CONFIG.hideOsmAnd ? `<a href="geo:${lat},${lng}" title="Open in OsmAnd or any geo: handler"><i class="fa-solid fa-map" style="margin-right:0.3em;"></i>OsmAnd</a>` : ''}
        <a href="https://www.google.com/maps/search/?api=1&query=${lat},${lng}" target="_blank">${MAP_CONFIG.googleMapsLabel || 'Google Maps ↗'}</a>
        ${p.url ? `<a href="${p.url}" ${cat === 'Area Guide' ? '' : 'target="_blank"'} style="${cat === 'Area Guide' ? 'font-weight:700;color:#1a3a5c;' : ''}">${cat === 'Area Guide' ? '<i class="fa-solid fa-map" style="margin-right:0.3em;"></i>Open Lamai Map →' : (MAP_CONFIG.urlLabel || 'Source ↗')}</a>` : ''}
        ${p.youtube_url ? `<a href="${p.youtube_url}" target="_blank"><i class="fa-brands fa-youtube" style="margin-right:0.3em;"></i>YouTube</a>` : ''}
        ${!MAP_CONFIG.hideRoute ? `<a href="#" data-route-poi="${f._id}" onclick="event.preventDefault();event.stopPropagation();showRoute(${f._id});" title="Itinéraire depuis ma position"><i class="fa-solid fa-diamond-turn-right" style="margin-right:0.3em;"></i>Route</a>` : ''}
        ${!MAP_CONFIG.hidePermalink ? `<a href="?poi=${slug}" onclick="event.preventDefault();event.stopPropagation();navigator.clipboard.writeText(location.origin+location.pathname+'?poi=${slug}').then(()=>showToast('Link copied!'));" title="Copy permalink"><i class="fa-solid fa-link"></i></a>` : ''}
    </div>`;
    card.onclick = () => focusPOI(f);
    list.appendChild(card);
  });
  const pill = document.getElementById('show-more-pill');
  if (pill) {
    const poiListHidden = getComputedStyle(list).display === 'none';
    if (limit && filtered.length > limit && !poiListHidden) {
      pill.textContent = `… et ${(filtered.length - limit).toLocaleString()} autres. Utilisez la recherche pour affiner.`;
      pill.style.display = '';
    } else {
      pill.style.display = 'none';
    }
  } else if (limit && filtered.length > limit) {
    const note = document.createElement('p');
    note.style.cssText = 'color:#888;font-size:0.8rem;padding:0.5rem 1rem;text-align:center;';
    note.textContent = `… et ${(filtered.length - limit).toLocaleString()} autres. Utilisez la recherche pour affiner.`;
    list.appendChild(note);
  }
}

function focusPOI(f) {
  const [lng, lat] = f.geometry.coordinates;
  _flyingTo = true;
  map.flyTo([lat, lng], MAP_CONFIG.focusZoom || 15, { duration: 0.8 });
  map.once('moveend', () => { _flyingTo = false; });
  if (markers[f._id]) markers[f._id].openPopup();
  if (activeCard !== null) document.getElementById('card-' + activeCard)?.classList.remove('active');
  activeCard = f._id;
  document.getElementById('card-' + f._id)?.classList.add('active');
  document.getElementById('card-' + f._id)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  const u = new URL(window.location.href);
  u.searchParams.set('poi', slugify(f.properties.name));
  u.searchParams.delete('filter');
  history.replaceState({}, '', u);
  fadePOIs(f._id);
}

function filterPOIs() { renderSidebar(); updateMarkers(); }

function updateMarkers() {
  const search = document.getElementById('search').value.toLowerCase();
  if (markerCluster) {
    markerCluster.clearLayers();
  } else {
    Object.values(markers).forEach(m => map.removeLayer(m));
  }
  Object.keys(markers).forEach(k => delete markers[k]);
  allPOIs.forEach(f => {
    const p = f.properties;
    const cat = p.category || 'Other';
    const matchCat = activeFilter === 'All' || cat === activeFilter;
    const matchSearch = !search || p.name.toLowerCase().includes(search) || (p.address||'').toLowerCase().includes(search);
    if (!matchCat || !matchSearch) return;
    const [lng, lat] = f.geometry.coordinates;
    const ytId = p.youtube_url ? (p.youtube_url.match(/(?:youtu\.be\/|[?&]v=)([^&?#]+)/)?.[1] || null) : null;
    const ytW = p.youtube_vertical ? 180 : 280;
    const ytH = p.youtube_vertical ? 320 : 157;
    const marker = L.marker([lat, lng], { icon: makeIcon(cat, p.status) });
    marker.bindPopup(
      `<b>${p.name}</b><br><small>${cat}</small>`
      + (ytId
          ? `<div style="margin-top:0.5rem;"><iframe width="${ytW}" height="${ytH}" src="https://www.youtube-nocookie.com/embed/${ytId}" frameborder="0" allowfullscreen style="border-radius:6px;display:block;"></iframe></div>`
          : (p.notes ? '<br><em>' + p.notes + '</em>' : '')
            + (p.hours ? '<br><i class="fa-regular fa-clock" style="margin-right:0.35em;"></i>' + p.hours.split(/;\s*/).join('<br>') : '')
            + (p.price ? '<br><i class="fa-solid fa-tag" style="margin-right:0.35em;"></i>' + p.price : '')
      ),
      ytId ? { maxWidth: p.youtube_vertical ? 200 : 300 } : {}
    );
    marker.on('click', () => focusPOI(f));
    if (markerCluster) {
      markerCluster.addLayer(marker);
    } else {
      marker.addTo(map);
    }
    markers[f._id] = marker;
  });
}

function setupFilters(pois) {
  const cats = ['All', ...new Set(pois.map(f => f.properties.category || 'Other'))];
  const container = document.getElementById('filter-btns');
  if (!container) return;
  container.innerHTML = '';
  cats.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn' + (cat === activeFilter ? ' active' : '');
    btn.dataset.cat = cat;
    const ic = CATEGORY_ICONS[cat];
    btn.innerHTML = ic ? `<i class="fa-solid ${ic}" style="margin-right:0.3em;"></i>${cat}` : cat;
    btn.onclick = () => {
      activeFilter = cat;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filterPOIs();
    };
    container.appendChild(btn);
  });
}

window.loadCustomData = function(geojson, sourceName) {
  if (customLayer) { map.removeLayer(customLayer); customLayer = null; }
  const features = geojson.features || [];
  const customPOIs = features
    .filter(f => f.geometry?.type === 'Point')
    .map((f, i) => ({ ...f, _id: 'custom-' + i, _custom: true }));
  const nonPoints = features.filter(f => f.geometry?.type !== 'Point');
  if (nonPoints.length) {
    customLayer = L.geoJSON({ type: 'FeatureCollection', features: nonPoints }, {
      style: () => ({ color: '#f59e0b', weight: 3, opacity: 0.8 }),
      onEachFeature: (feature, layer) => {
        if (feature.properties?.name) layer.bindPopup(`<b>${feature.properties.name}</b>`);
      }
    }).addTo(map);
  }
  allPOIs = [...allPOIs.filter(f => !f._custom), ...customPOIs];
  secondaryIds = new Set(allPOIs.filter(f => f.properties.status === 'secondary').map(f => String(f._id)));
  window.MAP_CONFIG.geojsonData = geojson;
  const badge = document.getElementById('custom-layer-info');
  badge.style.display = 'flex';
  document.getElementById('custom-layer-name').textContent = sourceName || 'Custom layer loaded';
  setupFilters(allPOIs);
  renderSidebar();
  updateMarkers();
  if (customPOIs.length) {
    const lls = customPOIs.map(f => [f.geometry.coordinates[1], f.geometry.coordinates[0]]);
    map.fitBounds(L.latLngBounds(lls).pad(0.1));
  }
};

window.removeCustomLayer = function() {
  if (customLayer) { map.removeLayer(customLayer); customLayer = null; }
  allPOIs = allPOIs.filter(f => !f._custom);
  document.getElementById('custom-layer-info').style.display = 'none';
  setupFilters(allPOIs);
  renderSidebar();
  updateMarkers();
};

fetch(MAP_CONFIG.geojsonUrl)
  .then(r => r.json())
  .then(data => {
    allPOIs = (data.v === 1 && window._expandCompact)
      ? window._expandCompact(data)
      : data.features.map((f, i) => ({ ...f, _id: i }));
    secondaryIds = new Set(allPOIs.filter(f => f.properties.status === 'secondary').map(f => String(f._id)));
    window.MAP_CONFIG.geojsonData = data;
    setupFilters(allPOIs);
    renderSidebar();
    updateMarkers();
    if (Object.keys(markers).length > 0) {
      map.fitBounds(L.featureGroup(Object.values(markers)).getBounds().pad(0.1));
    }
    const params = new URLSearchParams(window.location.search);
    const urlFilter = params.get('filter');
    if (urlFilter) {
      const btn = [...document.querySelectorAll('.filter-btn')].find(b => b.dataset.cat === urlFilter);
      if (btn) btn.click();
    }
    const urlPOI = params.get('poi');
    if (urlPOI) {
      const match = allPOIs.find(f => slugify(f.properties.name) === urlPOI);
      if (match) setTimeout(() => focusPOI(match), 350);
    }
  })
  .catch(() => {
    document.getElementById('poi-list').innerHTML = '<p style="color:#888;font-size:0.85rem;padding:1rem;">No locations loaded yet.</p>';
  });
</script>
