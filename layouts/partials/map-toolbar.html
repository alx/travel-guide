<!-- Map Toolbar — Download · GPX · Embed · Share · Load · GitHub -->
<!-- Each map page must set window.MAP_CONFIG = { title, geojsonUrl, embedPath, geojsonData? } -->
<div id="map-toolbar" style="display:flex;flex-wrap:wrap;gap:0.4rem;margin-bottom:0.75rem;align-items:center;">

  <!-- Download GeoJSON -->
  <button class="tb-btn" onclick="tbDownloadGeoJSON()" title="Download GeoJSON file">
    📥 GeoJSON
  </button>

  <!-- Export GPX for OsmAnd -->
  <button class="tb-btn" onclick="tbExportGPX()" title="Export as GPX for OsmAnd / GPS devices">
    🗺️ GPX
  </button>

  <!-- Embed iframe -->
  <button class="tb-btn" onclick="tbOpenEmbed()" title="Embed this map as an iframe">
    &lt;/&gt; Embed
  </button>

  <!-- Share URL -->
  <button class="tb-btn" onclick="tbShareURL()" id="tb-share-btn" title="Copy shareable link">
    🔗 Share
  </button>

  <!-- Load custom GeoJSON / TopoJSON -->
  <button class="tb-btn" onclick="tbOpenLoad()" title="Load your own GeoJSON or TopoJSON">
    📂 Load
  </button>

  <!-- PNG export for social media (9:16) -->
  <button class="tb-btn" onclick="tbExportPNG()" id="tb-png-btn" title="Export 9:16 share card for social media (Instagram Stories, TikTok…)">
    📸 PNG
  </button>

  <!-- GitHub integration -->
  <button class="tb-btn tb-github" onclick="tbOpenGitHub()" title="Sign in with GitHub · Load from repo · Submit PR" id="tb-github-btn">
    🐙 GitHub
  </button>
</div>

<style>
  .tb-btn {
    padding: 0.3rem 0.7rem; border-radius: 20px; border: 1.5px solid #ddd;
    background: white; cursor: pointer; font-size: 0.78rem; font-weight: 500;
    transition: all 0.15s; white-space: nowrap;
  }
  .tb-btn:hover { background: #f0f4ff; border-color: #1a3a5c; }
  .tb-btn.tb-github { border-color: #374151; }
  .tb-btn.tb-github.authed { border-color: #22c55e; color: #166534; background: #f0fdf4; }

  /* Modal overlay */
  .tb-modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 10000;
    display: flex; align-items: center; justify-content: center;
  }
  .tb-modal {
    background: white; border-radius: 14px; padding: 1.5rem;
    width: 90%; max-width: 460px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 8px 40px rgba(0,0,0,0.2);
  }
  .tb-modal h3 { font-size: 1rem; font-weight: 700; color: #1a3a5c; margin-bottom: 1rem; }
  .tb-modal-close {
    float: right; background: none; border: none; font-size: 1.2rem;
    cursor: pointer; color: #888; margin-top: -0.2rem;
  }
  .tb-input {
    width: 100%; padding: 0.45rem 0.7rem; border: 1.5px solid #ddd;
    border-radius: 8px; font-size: 0.85rem; font-family: inherit;
  }
  .tb-input:focus { outline: none; border-color: #1a3a5c; }
  .tb-code {
    width: 100%; padding: 0.5rem 0.7rem; border: 1.5px solid #e5e7eb;
    border-radius: 8px; font-size: 0.78rem; font-family: monospace;
    background: #f8f9fa; resize: vertical;
  }
  .tb-btn-primary {
    background: #1a3a5c; color: white; border: none; padding: 0.5rem 1.2rem;
    border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .tb-btn-primary:hover { background: #153050; }
  .tb-btn-secondary {
    background: #f0f4ff; color: #1a3a5c; border: 1.5px solid #1a3a5c;
    padding: 0.5rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
  }
  .tb-tabs { display: flex; gap: 0; margin-bottom: 1rem; border-bottom: 2px solid #e5e7eb; }
  .tb-tab {
    padding: 0.4rem 0.9rem; font-size: 0.82rem; font-weight: 500; cursor: pointer;
    border: none; background: none; color: #888; border-bottom: 2px solid transparent; margin-bottom: -2px;
  }
  .tb-tab.active { color: #1a3a5c; border-bottom-color: #1a3a5c; font-weight: 700; }
  .tb-status { font-size: 0.8rem; color: #555; margin-top: 0.4rem; min-height: 1.2rem; }
  .tb-divider { border: none; border-top: 1px solid #e5e7eb; margin: 0.9rem 0; }
  .tb-label { font-size: 0.8rem; font-weight: 600; color: #374151; margin-bottom: 0.35rem; display: block; }
  .tb-repo-item {
    padding: 0.5rem 0.7rem; border-radius: 8px; border: 1.5px solid #e5e7eb;
    cursor: pointer; font-size: 0.82rem; margin-bottom: 0.35rem; transition: border-color 0.15s;
  }
  .tb-repo-item:hover { border-color: #1a3a5c; }
</style>

<script>
(function () {

/* ── Helpers ── */
function getGeoJSON() {
  if (window.MAP_CONFIG?.geojsonData) return window.MAP_CONFIG.geojsonData;
  if (window.allPOIs) return { type: 'FeatureCollection', features: window.allPOIs };
  return null;
}

function getTitle() { return window.MAP_CONFIG?.title || document.title; }

function triggerDownload(content, filename, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type: mime }));
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

function closeAllModals() {
  document.querySelectorAll('.tb-modal-overlay').forEach(m => m.remove());
}

/* ── Download GeoJSON ── */
window.tbDownloadGeoJSON = function () {
  const data = getGeoJSON();
  if (!data) {
    alert('Map data not loaded yet.');
    return;
  }
  const filename = (getTitle().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') || 'map') + '.geojson';
  triggerDownload(JSON.stringify(data, null, 2), filename, 'application/geo+json');
};

/* ── Export GPX ── */
window.tbExportGPX = function () {
  const data = getGeoJSON();
  if (!data) { alert('Map data not loaded yet.'); return; }

  const wpts = (data.features || []).filter(f => f.geometry?.type === 'Point');
  const lines = (data.features || []).filter(f => f.geometry?.type === 'LineString');

  const esc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const title = esc(getTitle());

  let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n`;
  gpx += `<gpx version="1.1" creator="travels.girard-davila.net" xmlns="http://www.topografix.com/GPX/1/1">\n`;
  gpx += `  <metadata><name>${title}</name><desc>Exported from travels.girard-davila.net</desc></metadata>\n`;

  // Waypoints (POIs)
  wpts.forEach(f => {
    const [lng, lat] = f.geometry.coordinates;
    const p = f.properties || {};
    gpx += `  <wpt lat="${lat}" lon="${lng}">\n`;
    gpx += `    <name>${esc(p.name)}</name>\n`;
    if (p.notes || p.address) gpx += `    <desc>${esc(p.notes || p.address)}</desc>\n`;
    if (p.category) gpx += `    <type>${esc(p.category)}</type>\n`;
    gpx += `  </wpt>\n`;
  });

  // Routes / tracks
  lines.forEach(f => {
    const p = f.properties || {};
    gpx += `  <trk><name>${esc(p.name || 'Route')}</name><trkseg>\n`;
    f.geometry.coordinates.forEach(([lng, lat]) => {
      gpx += `    <trkpt lat="${lat}" lon="${lng}"></trkpt>\n`;
    });
    gpx += `  </trkseg></trk>\n`;
  });

  gpx += `</gpx>`;

  const filename = (getTitle().toLowerCase().replace(/\s+/g, '-').replace(/[^a-z0-9-]/g, '') || 'map') + '.gpx';
  triggerDownload(gpx, filename, 'application/gpx+xml');
};

/* ── Embed ── */
window.tbOpenEmbed = function () {
  closeAllModals();
  const path = window.MAP_CONFIG?.embedPath || window.location.pathname;
  const iframeURL = location.origin + path + '?embed=1';
  const code = `<iframe src="${iframeURL}" width="100%" height="500" frameborder="0" style="border-radius:12px;" title="${getTitle()}"></iframe>`;

  const overlay = document.createElement('div');
  overlay.className = 'tb-modal-overlay';
  overlay.innerHTML = `
    <div class="tb-modal">
      <h3>Embed this map <button class="tb-modal-close" onclick="this.closest('.tb-modal-overlay').remove()">✕</button></h3>
      <label class="tb-label">iframe code — paste into any webpage:</label>
      <textarea class="tb-code" rows="4" readonly id="tb-embed-code">${code}</textarea>
      <div style="margin-top:0.75rem;display:flex;gap:0.5rem;flex-wrap:wrap;">
        <button class="tb-btn-primary" onclick="
          navigator.clipboard.writeText(document.getElementById('tb-embed-code').value);
          this.textContent='✅ Copied!';setTimeout(()=>this.textContent='📋 Copy code',1800);">
          📋 Copy code
        </button>
        <button class="tb-btn-secondary" onclick="this.closest('.tb-modal-overlay').remove()">Close</button>
      </div>
      <hr class="tb-divider">
      <label class="tb-label" style="margin-bottom:0.25rem;">Preview (live):</label>
      <iframe src="${iframeURL}" width="100%" height="220" frameborder="0" style="border-radius:8px;border:1px solid #e5e7eb;" loading="lazy"></iframe>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
};

/* ── Share URL ── */
window.tbShareURL = function () {
  navigator.clipboard.writeText(location.href).then(() => {
    const btn = document.getElementById('tb-share-btn');
    btn.textContent = '✅ Copied!';
    setTimeout(() => btn.textContent = '🔗 Share', 1800);
  });
};

/* ── Load custom GeoJSON / TopoJSON ── */
window.tbOpenLoad = function () {
  closeAllModals();
  const pat = localStorage.getItem('github_pat') || '';
  const overlay = document.createElement('div');
  overlay.className = 'tb-modal-overlay';
  overlay.innerHTML = `
    <div class="tb-modal" style="max-width:500px;">
      <h3>Load custom map data <button class="tb-modal-close" onclick="this.closest('.tb-modal-overlay').remove()">✕</button></h3>

      <div class="tb-tabs">
        <button class="tb-tab active" onclick="tbLoadTab('file',this)">📁 File</button>
        <button class="tb-tab" onclick="tbLoadTab('url',this)">🔗 URL</button>
        <button class="tb-tab" onclick="tbLoadTab('forks',this);tbLoadForks()">🐙 GitHub Forks</button>
      </div>

      <!-- File tab -->
      <div id="tb-load-file">
        <p style="font-size:0.82rem;color:#555;margin-bottom:0.75rem;">Upload a <strong>GeoJSON</strong> or <strong>TopoJSON</strong> file from your device.</p>
        <input type="file" accept=".geojson,.json,.topojson" style="font-size:0.82rem;" onchange="tbLoadFile(this)">
      </div>

      <!-- URL tab -->
      <div id="tb-load-url" style="display:none;">
        <p style="font-size:0.82rem;color:#555;margin-bottom:0.75rem;">Load from any public URL — GitHub raw, S3, Gist, etc.</p>
        <div style="display:flex;gap:0.4rem;margin-bottom:0.5rem;">
          <input class="tb-input" id="tb-url-input" type="url" placeholder="https://raw.githubusercontent.com/…/file.geojson" style="flex:1;">
          <button class="tb-btn-primary" onclick="tbLoadURL()">Load</button>
        </div>
        <p id="tb-load-status" class="tb-status"></p>
      </div>

      <!-- GitHub Forks tab -->
      <div id="tb-load-forks" style="display:none;">
        <p style="font-size:0.82rem;color:#555;margin-bottom:0.75rem;">
          Browse public forks of <strong>alx/travel-guide</strong> and load their GeoJSON/TopoJSON files.
          ${pat ? '' : '<br><span style="color:#888;">Sign in via 🐙 GitHub for higher rate limits.</span>'}
        </p>
        <div id="tb-forks-list" style="max-height:360px;overflow-y:auto;">
          <p style="color:#888;font-size:0.82rem;text-align:center;padding:1rem;">⏳ Loading forks…</p>
        </div>
        <p id="tb-forks-status" class="tb-status"></p>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
};

window.tbLoadTab = function(tab, btn) {
  ['file','url','forks'].forEach(t => {
    document.getElementById('tb-load-' + t).style.display = t === tab ? '' : 'none';
  });
  document.querySelectorAll('.tb-modal .tb-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
};

/* ── Fetch forks and their GeoJSON files ── */
window.tbLoadForks = async function() {
  const list = document.getElementById('tb-forks-list');
  const status = document.getElementById('tb-forks-status');
  if (!list) return;

  const pat = localStorage.getItem('github_pat') || '';
  const headers = pat
    ? { Authorization: 'Bearer ' + pat, 'X-GitHub-Api-Version': '2022-11-28' }
    : { 'X-GitHub-Api-Version': '2022-11-28' };

  try {
    // Fetch all forks (up to 100)
    const r = await fetch('https://api.github.com/repos/alx/travel-guide/forks?per_page=100&sort=newest', { headers });
    if (r.status === 403) { list.innerHTML = '<p style="color:#888;font-size:0.82rem;padding:0.5rem;">⚠️ GitHub rate limit hit. Sign in via 🐙 GitHub for more requests.</p>'; return; }
    const forks = await r.json();

    if (!Array.isArray(forks) || forks.length === 0) {
      list.innerHTML = '<p style="color:#888;font-size:0.82rem;padding:0.5rem;">No public forks found yet. Be the first to fork <a href="https://github.com/alx/travel-guide" target="_blank">alx/travel-guide</a>!</p>';
      return;
    }

    list.innerHTML = '';
    forks.forEach(fork => {
      const item = document.createElement('div');
      item.style.cssText = 'border:1.5px solid #e5e7eb;border-radius:10px;padding:0.75rem;margin-bottom:0.5rem;';
      item.innerHTML = `
        <div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem;">
          <img src="${fork.owner.avatar_url}" width="22" height="22" style="border-radius:50%;">
          <strong style="font-size:0.85rem;color:#1a3a5c;">
            <a href="${fork.html_url}" target="_blank" style="color:inherit;text-decoration:none;">${fork.full_name}</a>
          </strong>
          <span style="font-size:0.72rem;color:#888;margin-left:auto;">${new Date(fork.updated_at).toLocaleDateString()}</span>
        </div>
        <div style="display:flex;gap:0.4rem;align-items:center;">
          <select id="branch-${fork.id}" class="tb-input" style="flex:1;padding:0.3rem 0.5rem;font-size:0.8rem;" onchange="tbForkBranchChange('${fork.owner.login}','travel-guide',this.value,'files-${fork.id}')">
            <option value="">⏳ Loading branches…</option>
          </select>
        </div>
        <div id="files-${fork.id}" style="margin-top:0.5rem;"></div>`;
      list.appendChild(item);

      // Load branches for this fork async
      tbLoadForkBranches(fork.owner.login, 'travel-guide', fork.id, headers);
    });

    status.textContent = `${forks.length} fork${forks.length === 1 ? '' : 's'} found.`;
  } catch (err) {
    list.innerHTML = '<p style="color:#888;font-size:0.82rem;padding:0.5rem;">❌ Failed to load forks: ' + err.message + '</p>';
  }
};

window.tbLoadForkBranches = async function(owner, repo, forkId, headers) {
  const select = document.getElementById('branch-' + forkId);
  if (!select) return;
  try {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}/branches?per_page=30`, { headers });
    const branches = await r.json();
    if (!Array.isArray(branches)) { select.innerHTML = '<option>No branches</option>'; return; }
    select.innerHTML = '<option value="">— pick a branch —</option>'
      + branches.map(b => `<option value="${b.name}"${b.name === 'main' || b.name === 'master' ? ' selected' : ''}>${b.name}</option>`).join('');
    // Auto-load default branch
    const def = branches.find(b => b.name === 'main' || b.name === 'master') || branches[0];
    if (def) tbForkBranchChange(owner, repo, def.name, 'files-' + forkId);
  } catch {
    select.innerHTML = '<option>Error loading</option>';
  }
};

window.tbForkBranchChange = async function(owner, repo, branch, filesContainerId) {
  const container = document.getElementById(filesContainerId);
  if (!container || !branch) return;
  container.innerHTML = '<span style="font-size:0.75rem;color:#888;">⏳ Scanning for GeoJSON…</span>';

  const pat = localStorage.getItem('github_pat') || '';
  const headers = pat
    ? { Authorization: 'Bearer ' + pat, 'X-GitHub-Api-Version': '2022-11-28' }
    : { 'X-GitHub-Api-Version': '2022-11-28' };

  try {
    // Get the full tree recursively
    const refR = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/ref/heads/${encodeURIComponent(branch)}`, { headers });
    const refData = await refR.json();
    const sha = refData.object?.sha;
    if (!sha) { container.innerHTML = '<span style="font-size:0.75rem;color:#888;">Branch not found.</span>'; return; }

    const treeR = await fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${sha}?recursive=1`, { headers });
    const treeData = await treeR.json();

    const geoFiles = (treeData.tree || []).filter(f =>
      f.type === 'blob' && /\.(geo)?json|\.topojson$/i.test(f.path) && f.path.startsWith('static/')
    );

    if (!geoFiles.length) {
      container.innerHTML = '<span style="font-size:0.75rem;color:#888;">No GeoJSON/TopoJSON files in static/.</span>';
      return;
    }

    container.innerHTML = geoFiles.map(f => {
      const rawUrl = `https://raw.githubusercontent.com/${owner}/${repo}/${branch}/${f.path}`;
      const label = f.path.replace('static/', '').replace('/locations.geojson', '').replace(/\.(geo)?json|\.topojson$/i, '');
      return `<div class="tb-repo-item" style="display:flex;align-items:center;gap:0.5rem;padding:0.4rem 0.6rem;" onclick="tbLoadURL_direct('${rawUrl}','${label}')">
        <span style="font-size:1rem;">📄</span>
        <span style="font-size:0.8rem;font-weight:500;flex:1;">${label}</span>
        <span style="font-size:0.72rem;color:#888;">${f.path.split('/').pop()}</span>
      </div>`;
    }).join('');
  } catch (err) {
    container.innerHTML = '<span style="font-size:0.75rem;color:#c00;">❌ ' + err.message + '</span>';
  }
};

window.tbLoadFile = function(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const data = JSON.parse(e.target.result);
      tbIngestData(data, file.name);
      input.closest('.tb-modal-overlay').remove();
    } catch (err) {
      document.getElementById('tb-load-status').textContent = '❌ Invalid JSON: ' + err.message;
    }
  };
  reader.readAsText(file);
};

window.tbLoadURL = function() {
  const url = document.getElementById('tb-url-input').value.trim();
  const status = document.getElementById('tb-load-status');
  if (!url) return;
  status.textContent = '⏳ Loading…';
  fetch(url)
    .then(r => r.json())
    .then(data => {
      tbIngestData(data, url.split('/').pop());
      document.querySelector('.tb-modal-overlay')?.remove();
    })
    .catch(err => {
      status.textContent = '❌ Failed to load: ' + err.message;
    });
};

window.tbIngestData = function(data, sourceName) {
  let geojson;
  if (data.type === 'Topology') {
    // TopoJSON — convert all objects to GeoJSON
    if (typeof topojson === 'undefined') {
      alert('topojson-client not loaded. Cannot convert TopoJSON.');
      return;
    }
    const features = [];
    Object.keys(data.objects).forEach(key => {
      const fc = topojson.feature(data, data.objects[key]);
      features.push(...fc.features);
    });
    geojson = { type: 'FeatureCollection', features };
  } else if (data.type === 'FeatureCollection' || data.type === 'Feature') {
    geojson = data.type === 'Feature' ? { type: 'FeatureCollection', features: [data] } : data;
  } else {
    alert('Unrecognised format. Expected GeoJSON FeatureCollection or TopoJSON Topology.');
    return;
  }

  if (typeof window.loadCustomData === 'function') {
    window.loadCustomData(geojson, sourceName);
  } else {
    alert('This map page does not support live data loading yet.');
  }
};

/* ── GitHub Panel ── */
window.tbOpenGitHub = function () {
  closeAllModals();
  const pat = localStorage.getItem('github_pat') || '';
  const user = JSON.parse(localStorage.getItem('github_user') || 'null');
  const overlay = document.createElement('div');
  overlay.className = 'tb-modal-overlay';
  overlay.id = 'tb-github-overlay';
  overlay.innerHTML = `
    <div class="tb-modal" style="max-width:520px;">
      <h3>🐙 GitHub Integration <button class="tb-modal-close" onclick="this.closest('.tb-modal-overlay').remove()">✕</button></h3>

      <div class="tb-tabs">
        <button class="tb-tab active" onclick="tbGHTab('signin',this)" id="gh-tab-signin">Sign In</button>
        <button class="tb-tab" onclick="tbGHTab('load',this)" id="gh-tab-load">Load GeoJSON</button>
        <button class="tb-tab" onclick="tbGHTab('pr',this)" id="gh-tab-pr">Submit PR</button>
      </div>

      <!-- Sign In Tab -->
      <div id="gh-panel-signin">
        ${user ? `
          <div style="background:#f0fdf4;border:1.5px solid #86efac;border-radius:10px;padding:1rem;margin-bottom:0.9rem;display:flex;align-items:center;gap:0.75rem;">
            <img src="${user.avatar_url}" width="40" height="40" style="border-radius:50%;">
            <div>
              <div style="font-weight:700;color:#166534;">✅ Signed in as <a href="${user.html_url}" target="_blank" style="color:#166534;">@${user.login}</a></div>
              <div style="font-size:0.78rem;color:#555;">${user.name || ''}</div>
            </div>
          </div>
          <button class="tb-btn-secondary" onclick="tbGHSignOut()" style="width:100%;">Sign out</button>
        ` : `
          <p style="font-size:0.82rem;color:#555;line-height:1.6;margin-bottom:0.9rem;">Sign in to load GeoJSON files from your own GitHub repositories and submit pull requests to <strong>alx/travel-guide</strong>.</p>

          <div style="background:#eff6ff;border-radius:10px;padding:1rem;margin-bottom:0.9rem;border:1px solid #bfdbfe;">
            <div style="font-weight:700;font-size:0.85rem;color:#1e40af;margin-bottom:0.5rem;">🔐 OAuth sign-in (recommended)</div>
            <p style="font-size:0.78rem;color:#555;margin-bottom:0.6rem;">Redirects to GitHub to authorize — no token copy-paste needed.</p>
            <button class="tb-btn-primary" onclick="tbGHOAuthStart()" style="width:100%;">Sign in with GitHub →</button>
            <p id="gh-device-status" class="tb-status" style="text-align:center;min-height:1.4rem;"></p>
            <div id="gh-device-code-box" style="display:none;text-align:center;margin-top:0.5rem;">
              <div style="font-size:0.82rem;color:#555;margin-bottom:0.35rem;">Enter this code at <a href="https://github.com/login/device" target="_blank" style="color:#1d4ed8;font-weight:600;">github.com/login/device</a>:</div>

/* ── GitHub OAuth Device Flow ── */
window.tbGHOAuthStart = async function() {
  const clientId = window.GITHUB_CLIENT_ID;
  if (!clientId) {
    document.getElementById('gh-device-status').textContent = '⚠️ GitHub Client ID not configured. Use PAT method instead.';
    return;
  }
  const status = document.getElementById('gh-device-status');
  const codeBox = document.getElementById('gh-device-code-box');
  status.textContent = '⏳ Requesting device code…';

  try {
    const proxyUrl = window.GITHUB_WORKER_URL + '/github-device-code';
    const res = await fetch(proxyUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ client_id: clientId, scope: 'repo read:user' })
    });
    if (!res.ok) throw new Error('Worker returned ' + res.status);
    const d = await res.json();

    document.getElementById('gh-device-code-display').textContent = d.user_code;
    codeBox.style.display = '';
    status.textContent = '⏳ Waiting for you to authorize at github.com/login/device…';

    // Poll for token
    let attempts = 0;
    const interval = (d.interval || 5) * 1000;
    const poll = setInterval(async () => {
      attempts++;
      if (attempts > 36) { clearInterval(poll); status.textContent = '⏰ Timed out. Try again.'; return; }
      try {
        const tr = await fetch(window.GITHUB_WORKER_URL + '/github-device-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ client_id: clientId, device_code: d.device_code, grant_type: 'urn:ietf:params:oauth:grant-type:device_code' })
        });
        const td = await tr.json();
        if (td.access_token) {
          clearInterval(poll);
          localStorage.setItem('github_pat', td.access_token);
          await tbGHFetchUser(td.access_token);
        } else if (td.error !== 'authorization_pending') {
          clearInterval(poll);
          status.textContent = '❌ ' + (td.error_description || td.error);
        }
      } catch (e) { /* keep polling */ }
    }, interval);
  } catch (err) {
    status.textContent = '❌ ' + err.message;
  }
};

/* ── Create Fork + PR ── */
window.tbGHCreatePR = async function() {
  const token = localStorage.getItem('github_pat');
  const user  = JSON.parse(localStorage.getItem('github_user') || 'null');
  const data  = getGeoJSON();
  const filename = document.getElementById('gh-pr-filename').value.trim();
  const title    = document.getElementById('gh-pr-title').value.trim() || ('Add ' + filename + ' map');
  const body     = document.getElementById('gh-pr-body').value.trim();
  const status   = document.getElementById('gh-pr-status');
  const btn      = document.getElementById('gh-pr-btn');

  if (!token || !user) { status.textContent = '❌ Sign in first.'; return; }
  if (!filename)        { status.textContent = '❌ Enter a filename.'; return; }
  if (!data)            { status.textContent = '❌ No map data to submit.'; return; }

  btn.disabled = true;
  const upstream = 'alx/travel-guide';
  const [upOwner, upRepo] = upstream.split('/');

  try {
    // 1. Fork the upstream repo (idempotent)
    status.textContent = '⏳ Forking repository…';
    const forkRes = await fetch(`https://api.github.com/repos/${upstream}/forks`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28', Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify({ default_branch_only: true })
    });
    if (!forkRes.ok && forkRes.status !== 422) throw new Error('Fork failed: ' + forkRes.status);

    // Wait a moment for fork to propagate
    await new Promise(r => setTimeout(r, 2500));

    // 2. Get default branch SHA
    status.textContent = '⏳ Getting branch info…';
    const repoRes = await fetch(`https://api.github.com/repos/${user.login}/${upRepo}`, {
      headers: { Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28' }
    });
    const repoData = await repoRes.json();
    const defaultBranch = repoData.default_branch || 'main';

    const branchRes = await fetch(`https://api.github.com/repos/${user.login}/${upRepo}/git/refs/heads/${defaultBranch}`, {
      headers: { Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28' }
    });
    const branchData = await branchRes.json();
    const sha = branchData.object?.sha;
    if (!sha) throw new Error('Could not get branch SHA');

    // 3. Create a new branch
    const newBranch = 'add-' + filename.replace(/[^a-z0-9]/gi, '-').toLowerCase() + '-' + Date.now();
    status.textContent = '⏳ Creating branch…';
    await fetch(`https://api.github.com/repos/${user.login}/${upRepo}/git/refs`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
      body: JSON.stringify({ ref: `refs/heads/${newBranch}`, sha })
    });

    // 4. Create / update the file
    status.textContent = '⏳ Committing GeoJSON…';
    const filePath = `static/${filename}/locations.geojson`;
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    await fetch(`https://api.github.com/repos/${user.login}/${upRepo}/contents/${filePath}`, {
      method: 'PUT', headers: { Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: `Add ${filename} GeoJSON map`, content, branch: newBranch })
    });

    // 5. Open PR
    status.textContent = '⏳ Opening pull request…';
    const prRes = await fetch(`https://api.github.com/repos/${upOwner}/${upRepo}/pulls`, {
      method: 'POST', headers: { Authorization: 'Bearer ' + token, 'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, body: body + `\n\n---\n_Submitted via travels.girard-davila.net map toolbar_`, head: `${user.login}:${newBranch}`, base: defaultBranch })
    });
    const prData = await prRes.json();
    if (!prRes.ok) throw new Error(prData.message || 'PR failed');

    status.innerHTML = `✅ PR created! <a href="${prData.html_url}" target="_blank" style="color:#1d4ed8;font-weight:600;">View PR #${prData.number} →</a>`;
  } catch (err) {
    status.textContent = '❌ ' + err.message;
    btn.disabled = false;
  }
};

/* ═══════════════════════════════════════════════════════════════════════════
   📸 PNG Export — 9:16 social share card + PNG tEXt metadata chunk
   Aspect ratio: 9:16 (Instagram Stories, TikTok, Snapchat, YouTube Shorts)
   Output: 1080×1920 px (rendered at 540×960, pixelRatio 2)
   ═══════════════════════════════════════════════════════════════════════════ */

/* CRC-32 table — required for PNG chunk checksums */
const _crcTable = (() => {
  const t = new Uint32Array(256);
  for (let i = 0; i < 256; i++) {
    let c = i;
    for (let j = 0; j < 8; j++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
    t[i] = c;
  }
  return t;
})();

function _crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = _crcTable[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

/**
 * Inject tEXt metadata chunks into a PNG ArrayBuffer.
 * Inserted right after the IHDR chunk (byte 33).
 * Each entry becomes one tEXt chunk: keyword\0value (Latin-1 safe for URLs/ASCII).
 */
function injectPNGMetadata(arrayBuffer, meta) {
  const enc = new TextEncoder();
  const textChunks = [];
  for (const [kw, val] of Object.entries(meta)) {
    const data = enc.encode(kw + '\x00' + val);
    const chunk = new Uint8Array(12 + data.length);
    const dv = new DataView(chunk.buffer);
    dv.setUint32(0, data.length);               // 4-byte length
    chunk.set([116, 69, 88, 116], 4);           // 'tEXt' type
    chunk.set(data, 8);                         // keyword + null + value
    dv.setUint32(8 + data.length,               // CRC over type+data
      _crc32(chunk.slice(4, 8 + data.length)));
    textChunks.push(chunk);
  }
  const extra = textChunks.reduce((s, c) => s + c.length, 0);
  const src = new Uint8Array(arrayBuffer);
  const out = new Uint8Array(src.length + extra);
  out.set(src.slice(0, 33), 0);   // PNG sig (8 bytes) + IHDR chunk (25 bytes)
  let pos = 33;
  for (const chunk of textChunks) { out.set(chunk, pos); pos += chunk.length; }
  out.set(src.slice(33), pos);
  return out.buffer;
}

/**
 * Capture the live Leaflet map as a PNG data URL via manual canvas compositing.
 *
 * We avoid leaflet-image (creates new Image() objects inside callbacks which
 * triggers SES lockdown in browser extensions like MetaMask). Instead:
 *
 *  1. Swap OSM tiles → CARTO Voyager (loaded with crossOrigin:anonymous →
 *     canvas-safe, no taint). Wait for them to appear in the DOM.
 *  2. Draw the already-loaded <img> tile elements directly onto a canvas
 *     using getBoundingClientRect() for pixel-perfect positioning.
 *     No new Image() objects needed — reuses what the browser already has.
 *  3. Composite the SVG overlay pane (routes/polylines) via a Blob URL.
 *  4. Draw POI markers as coloured dots using latLngToContainerPoint().
 *     (DivIcon HTML markers can't be canvas-copied; dots are the best proxy.)
 *  5. Restore original tile layers.
 */
async function captureMapScreenshot() {
  const mapEl     = document.getElementById('map');
  const leafletMap = window._leafletMap;
  if (!mapEl || !leafletMap || typeof L === 'undefined') return null;

  // ── 1. Swap to CARTO tiles (CORS-safe) ──────────────────────────────
  const originals = [];
  leafletMap.eachLayer(l => { if (l instanceof L.TileLayer) originals.push(l); });
  originals.forEach(l => leafletMap.removeLayer(l));

  const cartoLayer = L.tileLayer(
    'https://basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}.png',
    { crossOrigin: 'anonymous', attribution: '' }
  );
  cartoLayer.addTo(leafletMap);

  await new Promise(resolve => {
    let done = false;
    const finish = () => { if (!done) { done = true; resolve(); } };
    cartoLayer.once('load', finish);
    setTimeout(finish, 5000);
  });
  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));

  // ── 2. Set up canvas ─────────────────────────────────────────────────
  const W = mapEl.offsetWidth;
  const H = mapEl.offsetHeight;
  const canvas = document.createElement('canvas');
  canvas.width  = W;
  canvas.height = H;
  const ctx     = canvas.getContext('2d');
  const mapRect = mapEl.getBoundingClientRect();

  // ── 3. Draw tile <img> elements (already in DOM, already CORS-loaded) ─
  const tileImgs = mapEl.querySelectorAll('.leaflet-tile-pane img.leaflet-tile');
  for (const img of tileImgs) {
    if (!img.complete || !img.naturalWidth) continue;
    const r = img.getBoundingClientRect();
    try {
      ctx.drawImage(img,
        Math.round(r.left - mapRect.left), Math.round(r.top - mapRect.top),
        Math.round(r.width), Math.round(r.height));
    } catch { /* tile couldn't be drawn — skip */ }
  }

  // ── 4. Composite SVG overlay (routes, polylines, polygons) ───────────
  const svgEl = mapEl.querySelector('.leaflet-overlay-pane svg');
  if (svgEl) {
    try {
      const svgStr = new XMLSerializer().serializeToString(svgEl);
      const blobUrl = URL.createObjectURL(new Blob([svgStr], { type: 'image/svg+xml' }));
      await new Promise(resolve => {
        const img = new Image();
        img.onload = () => {
          const r = svgEl.getBoundingClientRect();
          ctx.drawImage(img,
            Math.round(r.left - mapRect.left), Math.round(r.top - mapRect.top),
            Math.round(r.width), Math.round(r.height));
          URL.revokeObjectURL(blobUrl);
          resolve();
        };
        img.onerror = () => { URL.revokeObjectURL(blobUrl); resolve(); };
        img.src = blobUrl;
      });
    } catch (e) { console.warn('SVG overlay composite failed:', e); }
  }

  // ── 5. Draw POI markers as coloured dots ─────────────────────────────
  // DivIcon HTML markers can't be canvas-copied; we approximate them.
  const CAT_COLORS = {
    Beach:'#0ea5e9', Restaurant:'#f97316', Activity:'#22c55e', Hotel:'#8b5cf6',
    Shopping:'#ec4899', Cafe:'#f59e0b', Port:'#f97316', Fishing:'#0ea5e9',
    Anchorage:'#6366f1', Hazard:'#ef4444', Service:'#f59e0b', Other:'#6b7280',
  };
  for (const f of (window.allPOIs || [])) {
    if (f.geometry?.type !== 'Point') continue;
    const [lng, lat] = f.geometry.coordinates;
    const pt = leafletMap.latLngToContainerPoint([lat, lng]);
    if (pt.x < 0 || pt.y < 0 || pt.x > W || pt.y > H) continue;
    const color = CAT_COLORS[f.properties?.category] || '#6b7280';
    ctx.beginPath();
    ctx.arc(pt.x, pt.y, 7, 0, Math.PI * 2);
    ctx.fillStyle   = color;
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth   = 2;
    ctx.stroke();
  }

  // ── 6. Restore original tile layers ─────────────────────────────────
  leafletMap.removeLayer(cartoLayer);
  originals.forEach(l => leafletMap.addLayer(l));

  console.log('Map preview: canvas composite succeeded');
  return canvas.toDataURL('image/png');
}

        <div style="font-size:13px;opacity:0.65;margin-bottom:6px;letter-spacing:0.04em;">
          ${meta.emoji} ${meta.sub}
        </div>
        <div style="font-size:38px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;">
          ${title}
        </div>
      </div>

      <!-- URL footer -->
      <div style="position:absolute;bottom:0;left:0;right:0;height:80px;
        display:flex;align-items:center;padding:0 28px;gap:12px;
        border-top:1px solid rgba(255,255,255,0.1);">
        <div style="width:3px;height:28px;background:#f59e0b;border-radius:2px;flex-shrink:0;"></div>
        <div style="font-size:14px;font-weight:700;opacity:0.92;">${siteUrl}</div>
      </div>`;

  } else {
    // ── Fallback: no map — gradient card ─────────────────────────────
    card.style.background = 'linear-gradient(160deg,#0b1f35 0%,#1a3a5c 60%,#0e4f7a 100%)';
    card.innerHTML = `
      <div style="flex:1;display:flex;flex-direction:column;align-items:center;
        justify-content:center;padding:40px 32px;text-align:center;">
        <div style="font-size:80px;line-height:1;margin-bottom:20px;">${meta.emoji}</div>
        <div style="font-size:13px;opacity:0.6;margin-bottom:8px;letter-spacing:0.04em;">
          🗺️ Girard-Davila Travels · ${meta.sub}
        </div>
        <div style="font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;">
          ${title}
        </div>
      </div>
      <div style="background:rgba(0,0,0,0.4);padding:20px 28px;
        display:flex;align-items:center;gap:12px;flex-shrink:0;">
        <div style="width:3px;height:28px;background:#f59e0b;border-radius:2px;flex-shrink:0;"></div>
        <div style="font-size:14px;font-weight:700;opacity:0.92;">${siteUrl}</div>
      </div>`;
  }

  return card;
}

/** Main PNG export function */
window.tbExportPNG = async function () {
  const btn = document.getElementById('tb-png-btn');
  if (btn) { btn.textContent = '⏳ Rendering…'; btn.disabled = true; }

  if (typeof htmlToImage === 'undefined') {
    alert('html-to-image library not loaded. Check your internet connection.');
    if (btn) { btn.textContent = '📸 PNG'; btn.disabled = false; }
    return;
  }

  // Loading overlay covers the screen during map screenshot + card render
  const overlay = document.createElement('div');
  overlay.style.cssText = [
    'position:fixed', 'inset:0', 'z-index:99999',
    'background:rgba(10,20,35,0.93)',
    'display:flex', 'flex-direction:column', 'align-items:center', 'justify-content:center',
    'gap:0.6rem', 'color:white', 'font-family:inherit',
  ].join(';');
  const setOverlayMsg = (icon, msg, sub) => {
    overlay.innerHTML = `
      <div style="font-size:2rem;">${icon}</div>
      <div style="font-size:1rem;font-weight:600;">${msg}</div>
      <div style="font-size:0.78rem;opacity:0.45;">${sub}</div>`;
  };
  setOverlayMsg('🗺️', 'Capturing map…', 'rendering tiles & markers');
  document.body.appendChild(overlay);

  // Step 1: capture the live map using CARTO tiles (CORS-enabled)
  let mapDataUrl = null;
  try {
    mapDataUrl = await captureMapScreenshot();
  } catch (e) {
    console.warn('Map capture failed, continuing without map:', e);
  }

  // Step 2: build and render the share card
  setOverlayMsg('📸', 'Generating 9:16 share card…', '1080 × 1920 px');

  const card = buildShareCard(mapDataUrl);
  document.body.appendChild(card);

  await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
  await new Promise(r => setTimeout(r, 150));

  try {
    const dataUrl = await htmlToImage.toPng(card, {
      width: 540, height: 960, pixelRatio: 2,
      backgroundColor: '#0b1f35',
      skipFonts: true,          // avoids cross-origin CSS/font CORS errors
      style: { opacity: '1' },
    });

    const res    = await fetch(dataUrl);
    const buffer = await res.arrayBuffer();

    const cfg   = window.MAP_CONFIG || {};
    const title = (cfg.title || document.title).replace(/\s*[—–-]\s*Girard.Davila Travels$/i,'').trim();
    const withMeta = injectPNGMetadata(buffer, {
      'Title':         title,
      'Source':        location.href,
      'Author':        'Girard-Davila Travels',
      'URL':           location.href,
      'Software':      'travels.girard-davila.net',
      'Creation Time': new Date().toISOString(),
      'Comment':       `${(window.allPOIs||[]).filter(f=>!f.properties?.premium).length} curated spots · 9:16 · CARTO map`,
    });

    const filename = title.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') + '-share.png';
    const blob = new Blob([withMeta], { type: 'image/png' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);

    if (btn) { btn.textContent = '✅ Done!'; setTimeout(() => { btn.textContent = '📸 PNG'; btn.disabled = false; }, 1800); }
  } catch (err) {
    console.error('PNG export error:', err);
    alert('PNG export failed: ' + err.message);
    if (btn) { btn.textContent = '📸 PNG'; btn.disabled = false; }
  } finally {
    document.body.removeChild(card);
    document.body.removeChild(overlay);
  }
};

})(); // end IIFE
</script>
